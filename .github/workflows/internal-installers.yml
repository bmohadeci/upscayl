name: Internal Windows and Mac installers

on:
  workflow_dispatch:
  push:
    branches: ["codex/internal-installers"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            platform: win
            arch: x64
            executable: dist/internal/win-unpacked/Upscayl.exe
          - name: Mac Apple Silicon
            os: macos-14
            platform: mac
            arch: arm64
            executable: dist/internal/mac-arm64/Upscayl.app/Contents/MacOS/Upscayl
          - name: Mac Intel
            os: macos-15-intel
            platform: mac
            arch: x64
            executable: dist/internal/mac/Upscayl.app/Contents/MacOS/Upscayl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer
        run: npx --no-install electron-builder --config electron-builder.internal.json --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Install Vulkan runtime on Windows test host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hosted runners have no GPU driver to supply the Vulkan loader.
          # This is a test prerequisite; it does not add a GPU or alter the app.
          $runtime = Join-Path $env:RUNNER_TEMP 'VulkanRT.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/VulkanRT-X64-1.4.357.0-Installer.exe' -OutFile $runtime
          if ((Get-FileHash $runtime -Algorithm SHA256).Hash -ne '58A9EDEE599E06DAC0485DF9EA7767016CC137C776D5D95AE08301FFF2DEF81C') { throw 'Vulkan runtime checksum mismatch' }
          $process = Start-Process $runtime -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan runtime installation failed: $($process.ExitCode)" }
          if (!(Test-Path "$env:WINDIR/System32/vulkan-1.dll")) { throw 'Vulkan loader missing' }
      - name: Verify packaged application
        run: node scripts/smoke-packaged.cjs "${{ matrix.executable }}"
      - name: Install and verify Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/internal/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Upscayl Internal Smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/smoke-packaged.cjs "$installDir/Upscayl.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed application failed verification' }
      - name: Verify Mac disk image
        if: runner.os == 'macOS'
        run: hdiutil verify dist/internal/*.dmg
      - name: Generate checksums
        shell: bash
        run: node scripts/installer-checksums.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: upscayl-internal-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/internal/*.exe
            dist/internal/*.dmg
            dist/internal/SHA256SUMS.txt
            dist/internal/smoke-*.png

  draft-release:
    name: Prepare verified installer release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installer-artifacts
          pattern: upscayl-internal-*
      - name: Assemble colleague handoff
        run: |
          mkdir release
          find installer-artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} release/ \;
          test "$(find release -type f | wc -l)" -eq 3
          cp INTERNAL-BUILDS.md release/INSTALLATION.md
          git archive --format=zip --prefix=upscayl-source/ -o release/upscayl-internal-2.15.0-internal.2-source.zip HEAD
          printf 'Source commit: %s\nBuild run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release/BUILD-INFO.txt
          cd release
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
      - name: Stage draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.15.0-internal.2 release/* --draft --prerelease --latest=false --target "$GITHUB_SHA" --title 'Upscayl 2.15.0-internal.2 — Windows and Mac' --notes-file RELEASE-NOTES.md
